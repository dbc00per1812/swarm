<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="1200" height="630" fill="#F6F4EF"/>
  <rect x="0" y="0" width="1200" height="56" fill="#1F3A34"/>
  <text x="600" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="3">SAMPLE DATA · ILLUSTRATIVE DEMO</text>
  <text x="60" y="130" font-size="46" font-weight="700" fill="#1F2A2A">Spot overdue invoices at a glance.</text>
  <rect x="60" y="170" width="300" height="130" rx="14" fill="#FFFFFF" stroke="#D9D4C7" stroke-width="2"/>
  <text x="84" y="210" font-size="20" fill="#5B6461">Outstanding</text>
  <text x="84" y="270" font-size="48" font-weight="700" fill="#1F2A2A">$450</text>
  <rect x="384" y="170" width="300" height="130" rx="14" fill="#FFFFFF" stroke="#D9D4C7" stroke-width="2"/>
  <text x="408" y="210" font-size="20" fill="#5B6461">Overdue invoices</text>
  <text x="408" y="270" font-size="48" font-weight="700" fill="#B23A2E">1</text>
  <rect x="60" y="330" width="624" height="48" rx="8" fill="#E7E2D6"/>
  <text x="80" y="361" font-size="18" font-weight="700" fill="#3A4441">Invoice</text>
  <text x="300" y="361" font-size="18" font-weight="700" fill="#3A4441">Amount</text>
  <text x="420" y="361" font-size="18" font-weight="700" fill="#3A4441">Status</text>
  <text x="530" y="361" font-size="18" font-weight="700" fill="#3A4441">Due</text>
  <rect x="60" y="384" width="624" height="58" rx="8" fill="#FFFFFF" stroke="#D9D4C7" stroke-width="2"/>
  <text x="80" y="420" font-size="19" fill="#1F2A2A">Sample invoice</text>
  <text x="300" y="420" font-size="19" fill="#1F2A2A">$450</text>
  <text x="420" y="420" font-size="19" fill="#1F2A2A">Sent</text>
  <rect x="514" y="398" width="164" height="32" rx="16" fill="#F7DCD6"/>
  <text x="597" y="420" text-anchor="middle" font-size="17" font-weight="700" fill="#B23A2E">1 day overdue</text>
  <rect x="740" y="170" width="400" height="272" rx="14" fill="#1F3A34"/>
  <text x="772" y="228" font-size="26" font-weight="700" fill="#FFFFFF">Freelancer invoice,</text>
  <text x="772" y="264" font-size="26" font-weight="700" fill="#FFFFFF">income &amp; expense</text>
  <text x="772" y="300" font-size="26" font-weight="700" fill="#FFFFFF">tracker spreadsheet.</text>
  <text x="772" y="370" font-size="20" fill="#CFE3DC">Tested in LibreOffice Calc.</text>
  <line x1="60" y1="520" x2="1140" y2="520" stroke="#D9D4C7" stroke-width="2"/>
  <text x="60" y="566" font-size="18" fill="#5B6461">Illustrative example with synthetic values. Not real customer data.</text>
</svg>
